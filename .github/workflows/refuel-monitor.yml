name: Refuel delivery monitor

# Independent of the Elyport app: runs monitor/check-refuel.mjs against public RPCs, with no
# secrets and no call to elyport.com. Fails (GitHub emails the repo owner) if a refuel was marked
# delivered without a vault payout, or a vault payout matches no deposit.

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: monitor
      - run: node check-refuel.mjs
        working-directory: monitor
