name: Official token detector check

# Runs the site's official-token detector against a real Montra launch on Elysium mainnet,
# through both the Montra API path and the on-chain fallback.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - web/src/lib/officialTokenCore.ts
      - web/scripts/check-official.mts

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx -y tsx scripts/check-official.mts
