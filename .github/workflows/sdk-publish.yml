name: Publish SDK

# Manual: publishes sdk/ to npm as @elyport/sdk.
# First release: uses the NPM_TOKEN secret (granular token, read and write on @elyport).
# After that: npm Trusted Publishing (OIDC) for this workflow, so NPM_TOKEN can be deleted.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PUBLISH to publish the version in sdk/package.json
        required: true

jobs:
  publish:
    if: github.event.inputs.confirm == 'PUBLISH'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
