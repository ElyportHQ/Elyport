name: Publish SDK

# Manual: publishes sdk/ to npm as @elyport/sdk.
# Auth: npm Trusted Publishing (OIDC) configured for this workflow on npmjs.com, no token needed.
# Bump the version in sdk/package.json before running it.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PUBLISH to publish the version in sdk/package.json
        required: true

jobs:
  publish:
    if: github.event.inputs.confirm == 'PUBLISH'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing support
        run: npm install -g npm@latest && npm --version
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
