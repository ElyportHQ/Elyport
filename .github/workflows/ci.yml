name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    name: Contracts (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install libraries
        run: |
          forge install foundry-rs/forge-std@v1.9.4 --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.1.0 --no-git
      - name: Build
        run: forge build --sizes
      - name: Test
        run: forge test -vvv

  web:
    name: Web (typecheck + build)
    # Run after contracts; this account's runners start parallel jobs unreliably.
    needs: contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Show wallet stack versions
        run: npm ls wagmi @wagmi/core @wagmi/connectors viem @reown/appkit @reown/appkit-adapter-wagmi --all 2>/dev/null | head -60 || true
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  sdk:
    name: SDK (typecheck + build)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ABIs match the web app
        run: tail -n +2 sdk/src/abis.ts | diff - web/src/lib/abis.ts
      - name: Install
        working-directory: sdk
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: sdk
        run: npm run build
      - name: Smoke test
        working-directory: sdk
        run: node -e "import('./dist/index.js').then(m => { if (!m.createElyport || !m.ELYPORT_ADDRESSES.locker) process.exit(1); console.log('ok', Object.keys(m).length, 'exports') })"
